# Crimson Desktop. Presentation only: PAM, retries, grace and idle stay default.
# Reuse the existing native-size panorama halves without altering the assets.
background {
    monitor = DP-1
    path = /home/neo/.local/share/wallpapers/crimson/crimson-left.png
    color = rgb(111318)
    blur_passes = 1
    blur_size = 3
    brightness = 0.65
}

background {
    monitor = HDMI-A-2
    path = /home/neo/.local/share/wallpapers/crimson/crimson-right.png
    color = rgb(111318)
    blur_passes = 1
    blur_size = 3
    brightness = 0.65
}

# Clock/date on both outputs; password field and unlock hint on Lenovo DP-1 only.
label {
    monitor =
    text = $TIME
    font_family = Inter
    font_size = 72
    color = rgb(edeef2)
    position = 0, 190
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_family = Inter
    font_size = 18
    color = rgb(adb1bf)
    position = 0, 105
    halign = center
    valign = center
}

input-field {
    monitor = DP-1
    size = 360, 60
    font_family = Inter
    font_color = rgb(edeef2)
    inner_color = rgb(1a1c23)
    outer_color = rgba(e44759ff) rgba(9f203aff) rgba(9b6379ff) 45deg
    outline_thickness = 2
    rounding = 12
    fade_on_empty = false
    placeholder_text = <span foreground="##adb1bf">Password</span>
    check_color = rgb(e44759)
    fail_color = rgb(f05c6b)
    fail_text = Authentication failed — try again
    capslock_color = rgb(e8b86d)
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor = DP-1
    text = Enter to unlock
    font_family = Inter
    font_size = 13
    color = rgb(adb1bf)
    position = 0, -65
    halign = center
    valign = center
}
